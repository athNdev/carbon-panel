name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-backend:
    name: Backend Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Ensure embedded web build directory exists
        run: mkdir -p web/carbon-panel/build && touch web/carbon-panel/build/.gitkeep

      # Runs the full suite (`go test ./...`), same as `make test`, so CI,
      # Makefile and local dev all agree on what "the test suite" means.
      - name: Run Backend Test Suite
        run: make test

  lint-backend:
    name: Backend Lint & Vet
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Ensure embedded web build directory exists
        run: mkdir -p web/carbon-panel/build && touch web/carbon-panel/build/.gitkeep

      - name: go vet
        run: go vet ./...

      # Scoped to lines touched by this change (only-new-issues), since the
      # existing codebase has a pre-existing baseline of ~80 findings
      # (mostly errcheck on defer'd Close() calls and staticcheck style
      # suggestions) that are out of scope to fix in this PR. New/changed
      # code is held to the lint standard from here on.
      - name: golangci-lint (new/changed code only)
        uses: golangci/golangci-lint-action@db9de0fc1a667e1a49d2291a1a042dff081d78f6 # v9
        with:
          version: v2.13.2
          only-new-issues: true

  govulncheck:
    name: Govulncheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      # Fail only on findings with a published fix ("Fixed in: <ver>").
      # Findings with "Fixed in: N/A" (e.g. Moby daemon-side GO-2026-4887/
      # GO-2026-4883 via docker/docker client error paths) have no available
      # remediation; they are reported but non-blocking until MINE-134
      # (moby/moby/client migration) removes the module entirely.
      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          out=$(govulncheck ./... 2>&1) || true
          echo "$out"
          fixable=$(echo "$out" | grep "Fixed in:" | grep -v "N/A" || true)
          if [ -n "$fixable" ]; then
            echo "::error::govulncheck found vulnerabilities with available fixes:"
            echo "$fixable"
            exit 1
          fi

  # Race detector over concurrency-heavy packages (MINE-146).
  test-race:
    name: Go Race Detector
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Ensure embedded web build directory exists
        run: mkdir -p web/carbon-panel/build && touch web/carbon-panel/build/.gitkeep

      - name: Run race detector
        run: go test -race -count=1 ./internal/reconciler/ ./internal/scheduler/ ./internal/docker/ ./internal/activity/ ./internal/metrics/

  lint-proto:
    name: Proto Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up buf
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1
        with:
          version: '1.50.0'
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: buf lint
        run: buf lint

  test-frontend:
    name: Frontend Quality & Build Gate
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web/carbon-panel

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: SvelteKit Type & Component Diagnostics
        run: bun run check

      - name: Unit Tests
        run: bun run test

      - name: Production Vite Build
        run: bun run build
