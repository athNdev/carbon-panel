name: Module Builder

on:
  push:
    tags:
      - 'mod-*'
  workflow_dispatch:

jobs:
  generate-proto:
    name: Generate Proto Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Generate proto code
        run: |
          docker run --rm \
            --volume "${{ github.workspace }}:/workspace" \
            --workdir /workspace \
            bufbuild/buf:latest generate

      - name: Upload generated Go proto code
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: proto-go
          path: pkg/proto
          retention-days: 1

  build-modules:
    name: Build Module Images
    needs: generate-proto
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download generated Go proto code
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: proto-go
          path: pkg/proto

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Build and push all modules
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#mod-}"
          else
            VERSION=""
          fi

          for dockerfile in docker/Dockerfile.*; do
            name=$(basename "$dockerfile" | sed 's/Dockerfile\.//')
            if [ "$name" != "carbon-panel" ]; then
              echo "Building athndev/carbon-panel-$name (linux/amd64,linux/arm64)..."
              TAGS="--tag athndev/carbon-panel-$name:latest"
              if [ -n "$VERSION" ]; then
                TAGS="$TAGS --tag athndev/carbon-panel-$name:$VERSION"
              fi

              docker buildx build \
                --platform linux/amd64,linux/arm64 \
                --file "$dockerfile" \
                $TAGS \
                --push \
                .

              echo "Pushed athndev/carbon-panel-$name"
            fi
          done

          echo "Module builds complete!"
