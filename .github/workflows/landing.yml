# Deploys the standalone marketing landing page to GitHub Pages at the
# repository's default domain (https://athNdev.github.io/carbon-panel/).
#
# NOTE: A GitHub Pages site can only be served from one source at a time.
# This workflow and docs.yml (the Starlight docs site) both publish to the
# same github-pages environment, so whichever runs most recently serves the
# domain. If you want both, host the docs elsewhere or publish the docs under
# a sub-path. Set the Pages source to "GitHub Actions" in repo settings.

name: Deploy Landing Page to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'landing/**'
      - '.github/workflows/landing.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The landing page is plain static HTML/CSS/JS — no build step required.

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: landing

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
