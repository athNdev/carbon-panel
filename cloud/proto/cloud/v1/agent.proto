syntax = "proto3";

package cloud.v1;

import "cloud/v1/common.proto";
import "cloud/v1/file.proto";
import "cloud/v1/node.proto";
import "cloud/v1/workload.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/athNdev/carbon-panel/pkg/proto/cloud/v1;cloudv1";

// NodeIdentity is the credential material a node receives after joining.
message NodeIdentity {
  // Assigned node id.
  string node_id = 1;
  // Owning org id.
  string org_id = 2;
  // Control-plane endpoint the agent must dial.
  string control_plane_endpoint = 3;
  // PEM-encoded client certificate for mTLS.
  string client_cert_pem = 4;
  // PEM-encoded client private key for mTLS.
  string client_key_pem = 5;
  // PEM-encoded CA bundle to verify the control plane.
  string ca_cert_pem = 6;
  // Unix timestamp when the credential expires and must be renewed.
  int64 expires_at_unix = 7;
  // Heartbeat interval the agent must honour, in seconds.
  int32 heartbeat_interval_seconds = 8;
}

// AgentHello is the first message a connected agent sends.
message AgentHello {
  // Node id from the node's identity.
  string node_id = 1;
  // Agent semantic version.
  string agent_version = 2;
  // Docker Engine version the agent can reach.
  string docker_version = 3;
  // Hostname of the machine.
  string hostname = 4;
  // Declared capacity the agent believes it has.
  NodeCapacity capacity = 5;
}

// AgentHeartbeat is periodic liveness and telemetry.
message AgentHeartbeat {
  // Node id.
  string node_id = 1;
  // Latest telemetry.
  NodeMetrics metrics = 2;
  // Number of containers the agent manages.
  int32 container_count = 3;
  // Current allocation as computed by the agent.
  NodeAllocation allocation = 4;
  // Real-time workload metrics for running workloads on this node.
  repeated WorkloadMetrics workload_metrics = 5;
}

// AgentWorkloadStatus reports a workload transition observed on the node.
message AgentWorkloadStatus {
  // Node id.
  string node_id = 1;
  // Workload id.
  string workload_id = 2;
  // Observed status.
  WorkloadStatus status = 3;
  // Container id, when one exists.
  string container_id = 4;
  // Detail for non-running states, e.g. the last error line.
  string detail = 5;
  // Assigned or active host port on the node.
  int32 host_port = 6;
}

// AgentLogChunk is a batch of console lines for a workload.
message AgentLogChunk {
  // Node id.
  string node_id = 1;
  // Workload id.
  string workload_id = 2;
  // Lines in the chunk.
  repeated WorkloadLogLine lines = 3;
}

// AgentCommandResult is the outcome of a control command.
message AgentCommandResult {
  // Correlation id from the originating control message.
  string command_id = 1;
  // Whether the command succeeded.
  bool success = 2;
  // Error detail when it did not.
  string error = 3;
  // Command output, e.g. RCON response.
  string output = 4;
}

// AgentFileListResult returns directory contents.
message AgentFileListResult {
  // Correlation id.
  string command_id = 1;
  // Whether the operation succeeded.
  bool success = 2;
  // Error detail when it did not.
  string error = 3;
  // Directory entries.
  repeated FileInfo files = 4;
}

// AgentReadFileChunk is a chunk of a file streamed from the node.
message AgentReadFileChunk {
  // Correlation id.
  string command_id = 1;
  // Whether reading succeeded.
  bool success = 2;
  // Error detail when it did not.
  string error = 3;
  // Chunk payload (max 64KB).
  bytes chunk = 4;
  // Whether this is the final chunk.
  bool is_last = 5;
  // Total size of the file in bytes.
  int64 total_size = 6;
}

// AgentWriteFileResult acknowledges a file write.
message AgentWriteFileResult {
  // Correlation id.
  string command_id = 1;
  // Whether writing succeeded.
  bool success = 2;
  // Error detail when it did not.
  string error = 3;
  // Bytes written.
  int64 bytes_written = 4;
}

// AgentDeleteFileResult acknowledges file deletion.
message AgentDeleteFileResult {
  // Correlation id.
  string command_id = 1;
  // Whether deletion succeeded.
  bool success = 2;
  // Error detail when it did not.
  string error = 3;
}

// AgentCreateDirectoryResult acknowledges directory creation.
message AgentCreateDirectoryResult {
  // Correlation id.
  string command_id = 1;
  // Whether directory creation succeeded.
  bool success = 2;
  // Error detail when it did not.
  string error = 3;
}

// AgentStatFileResult returns file metadata.
message AgentStatFileResult {
  // Correlation id.
  string command_id = 1;
  // Whether stat succeeded.
  bool success = 2;
  // Error detail when it did not.
  string error = 3;
  // File metadata.
  FileInfo info = 4;
}

// AgentFileRenameResult acknowledges file renaming.
message AgentFileRenameResult {
  // Correlation id.
  string command_id = 1;
  // Whether rename succeeded.
  bool success = 2;
  // Error detail when it did not.
  string error = 3;
}

// AgentCreateBackupResult acknowledges snapshot creation.
message AgentCreateBackupResult {
  // Correlation id.
  string command_id = 1;
  // Workload id.
  string workload_id = 2;
  // Backup id.
  string backup_id = 3;
  // Whether snapshot creation succeeded.
  bool success = 20;
  // Error detail when it did not.
  string error = 4;
  // Size of archive in bytes.
  int64 size_bytes = 5;
  // SHA-256 checksum.
  string sha256 = 6;
}

// AgentRestoreBackupResult acknowledges snapshot restoration.
message AgentRestoreBackupResult {
  // Correlation id.
  string command_id = 1;
  // Workload id.
  string workload_id = 2;
  // Backup id.
  string backup_id = 3;
  // Whether restoration succeeded.
  bool success = 4;
  // Error detail when it did not.
  string error = 5;
}

// AgentDeleteBackupResult acknowledges snapshot deletion.
message AgentDeleteBackupResult {
  // Correlation id.
  string command_id = 1;
  // Workload id.
  string workload_id = 2;
  // Backup id.
  string backup_id = 3;
  // Whether deletion succeeded.
  bool success = 4;
  // Error detail when it did not.
  string error = 5;
}


// AgentGetWorkloadMetricsResult returns real-time telemetry for a workload.
message AgentGetWorkloadMetricsResult {
  // Correlation id.
  string command_id = 1;
  // Workload id.
  string workload_id = 2;
  // Whether metrics collection succeeded.
  bool success = 3;
  // Error detail if failed.
  string error = 4;
  // Real-time metrics.
  WorkloadMetrics metrics = 5;
}

// AgentMessage is anything the agent sends to the control plane.
message AgentMessage {
  // Exactly one payload per message.
  oneof payload {
    // Initial handshake, sent once per connection.
    AgentHello hello = 1;
    // Periodic liveness and telemetry.
    AgentHeartbeat heartbeat = 2;
    // Workload lifecycle transition observed locally.
    AgentWorkloadStatus workload_status = 3;
    // Console lines for a workload.
    AgentLogChunk logs = 4;
    // Result of a previously issued control command.
    AgentCommandResult command_result = 5;
    // Directory listing result.
    AgentFileListResult file_list_result = 6;
    // File read chunk.
    AgentReadFileChunk file_read_chunk = 7;
    // File write result.
    AgentWriteFileResult file_write_result = 8;
    // File deletion result.
    AgentDeleteFileResult file_delete_result = 9;
    // Directory creation result.
    AgentCreateDirectoryResult dir_create_result = 10;
    // File stat result.
    AgentStatFileResult file_stat_result = 11;
    // Backup creation result.
    AgentCreateBackupResult backup_create_result = 12;
    // Backup restore result.
    AgentRestoreBackupResult backup_restore_result = 13;
    // Backup delete result.
    AgentDeleteBackupResult backup_delete_result = 14;
    // Workload metrics query result.
    AgentGetWorkloadMetricsResult metrics_result = 15;
    // File rename result.
    AgentFileRenameResult file_rename_result = 16;
  }
}

// ControlWelcome acknowledges a connection and reports control-plane state.
message ControlWelcome {
  // Current time on the control plane, for clock skew detection.
  google.protobuf.Timestamp server_time = 1;
  // Heartbeat interval the agent must use, in seconds.
  int32 heartbeat_interval_seconds = 2;
  // Whether the node is currently draining.
  bool draining = 3;
}

// ControlWorkloadAssignment asks the agent to materialise or change a workload.
message ControlWorkloadAssignment {
  // Correlation id the agent must echo in its result.
  string command_id = 1;
  // Full desired state of the workload.
  Workload workload = 2;
  // Whether the underlying container should be started after materialising.
  bool start = 3;
}

// ControlWorkloadStop asks the agent to stop a workload's container.
message ControlWorkloadStop {
  // Correlation id.
  string command_id = 1;
  // Workload id.
  string workload_id = 2;
  // Grace period in seconds before killing.
  int32 timeout_seconds = 3;
}

// ControlWorkloadDelete asks the agent to remove a workload's container.
message ControlWorkloadDelete {
  // Correlation id.
  string command_id = 1;
  // Workload id.
  string workload_id = 2;
  // Whether to delete the workload's data volume as well.
  bool delete_data = 3;
}

// ControlRunCommand asks the agent to run a console command via RCON.
message ControlRunCommand {
  // Correlation id.
  string command_id = 1;
  // Workload id.
  string workload_id = 2;
  // Command text.
  string command = 3;
}

// ControlProbe asks the agent to refresh and report its telemetry.
message ControlProbe {
  // Correlation id.
  string command_id = 1;
}

// ControlDisconnect tells the agent to reconnect after a delay, e.g. to pick up
// rotated credentials.
message ControlDisconnect {
  // Seconds to wait before reconnecting.
  int32 reconnect_after_seconds = 1;
  // Why the control plane is closing the stream.
  string reason = 2;
}

// ControlFileList requests directory contents from a workload on the node.
message ControlFileList {
  // Correlation id.
  string command_id = 1;
  // Workload id.
  string workload_id = 2;
  // Path relative to workload root.
  string path = 3;
}

// ControlReadFile requests chunks of a file on the node.
message ControlReadFile {
  // Correlation id.
  string command_id = 1;
  // Workload id.
  string workload_id = 2;
  // Path relative to workload root.
  string path = 3;
}

// ControlWriteFileChunk writes a chunk (max 64KB) of a file on the node.
message ControlWriteFileChunk {
  // Correlation id.
  string command_id = 1;
  // Workload id.
  string workload_id = 2;
  // Path relative to workload root.
  string path = 3;
  // Data bytes.
  bytes chunk = 4;
  // Whether this is the final chunk.
  bool is_last = 5;
  // Unix file mode bits (optional).
  uint32 mode = 6;
}

// ControlDeleteFile deletes a file or directory on the node.
message ControlDeleteFile {
  // Correlation id.
  string command_id = 1;
  // Workload id.
  string workload_id = 2;
  // Path relative to workload root.
  string path = 3;
  // Whether to delete recursively.
  bool recursive = 4;
}

// ControlCreateDirectory creates a directory on the node.
message ControlCreateDirectory {
  // Correlation id.
  string command_id = 1;
  // Workload id.
  string workload_id = 2;
  // Path relative to workload root.
  string path = 3;
}

// ControlStatFile queries metadata for a path on the node.
message ControlStatFile {
  // Correlation id.
  string command_id = 1;
  // Workload id.
  string workload_id = 2;
  // Path relative to workload root.
  string path = 3;
}

// ControlFileRename renames a file or directory on the node.
message ControlFileRename {
  // Correlation id.
  string command_id = 1;
  // Workload id.
  string workload_id = 2;
  // Old path relative to workload root.
  string old_path = 3;
  // New path relative to workload root.
  string new_path = 4;
}

// ControlCreateBackup requests snapshot creation on the node.
message ControlCreateBackup {
  // Correlation id.
  string command_id = 1;
  // Workload id.
  string workload_id = 2;
  // Backup id.
  string backup_id = 3;
  // Name or description.
  string name = 4;
}

// ControlRestoreBackup requests snapshot restore on the node.
message ControlRestoreBackup {
  // Correlation id.
  string command_id = 1;
  // Workload id.
  string workload_id = 2;
  // Backup id to restore.
  string backup_id = 3;
}

// ControlDeleteBackup requests snapshot deletion on the node.
message ControlDeleteBackup {
  // Correlation id.
  string command_id = 1;
  // Workload id.
  string workload_id = 2;
  // Backup id to delete.
  string backup_id = 3;
}


// ControlGetWorkloadMetrics requests real-time telemetry for a workload.
message ControlGetWorkloadMetrics {
  // Correlation id.
  string command_id = 1;
  // Workload id.
  string workload_id = 2;
}

// ControlMessage is anything the control plane sends to an agent.
message ControlMessage {
  // Exactly one payload per message.
  oneof payload {
    // Handshake acknowledgement.
    ControlWelcome welcome = 1;
    // Materialise or change a workload.
    ControlWorkloadAssignment assign_workload = 2;
    // Stop a workload.
    ControlWorkloadStop stop_workload = 3;
    // Delete a workload.
    ControlWorkloadDelete delete_workload = 4;
    // Run a console command.
    ControlRunCommand run_command = 5;
    // Refresh telemetry.
    ControlProbe probe = 6;
    // Ask the agent to reconnect.
    ControlDisconnect disconnect = 7;
    // Directory listing request.
    ControlFileList file_list = 8;
    // File read request.
    ControlReadFile file_read = 9;
    // File write chunk.
    ControlWriteFileChunk file_write = 10;
    // File deletion request.
    ControlDeleteFile file_delete = 11;
    // Directory creation request.
    ControlCreateDirectory dir_create = 12;
    // File stat request.
    ControlStatFile file_stat = 13;
    // Create backup request.
    ControlCreateBackup create_backup = 14;
    // Restore backup request.
    ControlRestoreBackup restore_backup = 15;
    // Delete backup request.
    ControlDeleteBackup delete_backup = 16;
    // Workload metrics query request.
    ControlGetWorkloadMetrics get_workload_metrics = 17;
    // File rename request.
    ControlFileRename file_rename = 18;
  }
}

// JoinNodeRequest redeems a join token. It is the only call a node makes before
// it holds credentials, so it is authenticated by the token itself.
message JoinNodeRequest {
  // The plaintext join token.
  string token = 1;
  // Hostname of the joining machine.
  string hostname = 2;
  // Agent version.
  string agent_version = 3;
  // Docker Engine version the agent can reach.
  string docker_version = 4;
  // Capacity the agent declares.
  NodeCapacity capacity = 5;
  // Certificate signing request (PEM) generated locally by the agent; the
  // control plane signs it and returns the certificate without ever seeing the
  // private key.
  string csr_pem = 6;
}

// JoinNodeResponse returns the node's identity and credential.
message JoinNodeResponse {
  // Issued identity.
  NodeIdentity identity = 1;
  // Node record as registered.
  Node node = 2;
}

// AgentService is the node-facing API. Every method except JoinNode requires the
// node's client certificate.
service AgentService {
  // JoinNode redeems a join token and returns node credentials.
  rpc JoinNode(JoinNodeRequest) returns (JoinNodeResponse);
  // Connect opens the long-lived bidirectional control stream. The agent sends
  // AgentMessage frames and receives ControlMessage frames.
  // buf:lint:ignore RPC_REQUEST_STANDARD_NAME
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  rpc Connect(stream AgentMessage) returns (stream ControlMessage);
  // RenewCredentials rotates the node's certificate before expiry.
  rpc RenewCredentials(RenewCredentialsRequest) returns (RenewCredentialsResponse);
}

// RenewCredentialsRequest asks for a fresh certificate from the same CSR flow.
message RenewCredentialsRequest {
  // Certificate signing request (PEM).
  string csr_pem = 1;
}

// RenewCredentialsResponse returns the new identity material.
message RenewCredentialsResponse {
  // Refreshed identity.
  NodeIdentity identity = 1;
}
