apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "carbon-cloud.fullname" . }}-controld
  labels:
    {{- include "carbon-cloud.labels" . | nindent 4 }}
    app.kubernetes.io/component: controld
spec:
  replicas: {{ .Values.controld.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
      app.kubernetes.io/component: controld
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name | quote }}
        app.kubernetes.io/component: controld
    spec:
      serviceAccountName: {{ include "carbon-cloud.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controld
          image: "{{ .Values.controld.image.repository }}:{{ .Values.controld.image.tag }}"
          imagePullPolicy: {{ .Values.controld.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: CARBONCLOUD_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.existingSecret }}
                  key: database-url
                  optional: true
            - name: CARBONCLOUD_CLERK_ISSUER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.existingSecret }}
                  key: clerk-issuer
                  optional: true
            - name: CARBONCLOUD_NODE_JOIN_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.existingSecret }}
                  key: node-join-token-secret
                  optional: true
            {{- with .Values.controld.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.controld.resources | nindent 12 }}
