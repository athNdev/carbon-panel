# Air configuration for Carbon Panel live development reloading
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/carbon-panel-dev ./cmd/carbon-panel/main.go"
  bin = "./tmp/carbon-panel-dev"
  entrypoint = ["./tmp/carbon-panel-dev"]
  include_ext = ["go", "tpl", "tmpl", "html", "yaml", "yml"]
  exclude_dir = ["assets", "tmp", "vendor", "testdata", "web", "docs", "data", "docker"]
  include_dir = ["cmd", "internal", "pkg"]
  exclude_file = []
  delay = 1000
  stop_on_error = true
  log = "air-build-errors.log"

[build.windows]
  cmd = "go build -o ./tmp/carbon-panel-dev.exe ./cmd/carbon-panel/main.go"
  bin = "./tmp/carbon-panel-dev.exe"
  entrypoint = ["./tmp/carbon-panel-dev.exe"]

[log]
  time = false

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = true
