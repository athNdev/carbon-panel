# Air configuration for MineServer live development reloading
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/mineserver-dev ./cmd/discopanel/main.go"
  bin = "./tmp/mineserver-dev"
  full_bin = ""
  include_ext = ["go", "tpl", "tmpl", "html", "yaml", "yml"]
  exclude_dir = ["assets", "tmp", "vendor", "testdata", "web", "docs", "data", "docker"]
  include_dir = ["cmd", "internal", "pkg"]
  exclude_file = []
  delay = 1000
  stop_on_error = true
  log = "air-build-errors.log"

[log]
  time = false

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = true
