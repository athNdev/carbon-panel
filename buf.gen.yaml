version: v2
plugins:
  - remote: buf.build/community/sudorandom-connect-openapi:v0.21.3
    out: web/carbon-panel/static
    opt:
      - path=schemav1.yaml

  - remote: buf.build/community/sudorandom-connect-openapi:v0.21.3
    out: docs/carbon-panel/public
    opt:
      - path=schemav1.yaml

  # Generate Go code with protoc-gen-go
  #
  # Pinned to v1.36.12: the version that produced the committed pkg/proto tree.
  # Leaving this remote unpinned makes every `make proto` reformat the entire
  # generated tree when the plugin is upgraded upstream, burying the real change
  # in thousands of lines of churn (MINE-172).
  - remote: buf.build/protocolbuffers/go:v1.36.12
    out: pkg/proto
    opt:
      - paths=source_relative

  # Generate Connect-Go (pinned to match go.mod connectrpc.com/connect v1.19.1)
  - remote: buf.build/connectrpc/go:v1.19.1
    out: pkg/proto
    opt:
      - paths=source_relative

  # Generate TypeScript
  #
  # Pinned to v2.15.0 to match the committed tree and the installed runtime
  # floor in package.json ("@bufbuild/protobuf": "^2.10.0"). Bumping either side
  # independently means the generated code targets runtime APIs that may not
  # exist, so they move together and deliberately.
  - remote: buf.build/bufbuild/es:v2.15.0
    out: web/carbon-panel/src/lib/proto
    opt:
      - target=ts
      - import_extension=none
    include_imports: true