version: v2
modules:
  - path: proto
    name: github.com/athNdev/carbon-panel
lint:
  use:
    - STANDARD
    - COMMENTS
  except:
    - FIELD_NOT_REQUIRED
    - PACKAGE_NO_IMPORT_CYCLE
    - COMMENT_FIELD
    - COMMENT_ENUM_VALUE
  ignore:
    - google/protobuf
breaking:
  use:
    - FILE
  except:
    - EXTENSION_NO_DELETE
    - FIELD_SAME_DEFAULT
deps:
  - buf.build/googleapis/googleapis
  - buf.build/gnostic/gnostic