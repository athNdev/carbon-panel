version: "2"

run:
  timeout: 5m

linters:
  # "standard" = errcheck, govet, ineffassign, staticcheck, unused.
  # This is golangci-lint's own default set; we're not adding anything
  # exotic on top of it for this first pass. CI runs this with
  # only-new-issues so it only fails on issues introduced by a given
  # change, not the ~80 pre-existing findings across the codebase today.
  default: standard

  exclusions:
    paths:
      - pkg/proto # generated protobuf/connect code
