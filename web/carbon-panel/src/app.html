<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" type="image/png" sizes="16x16" href="/g1_16x16.png" />
		<link rel="icon" type="image/png" sizes="32x32" href="/g1_32x32.png" />
		<link rel="icon" type="image/png" sizes="64x64" href="/g1_64x64.png" />
		<link rel="icon" type="image/svg+xml" href="/g1_22.svg" />
		<link rel="apple-touch-icon" href="/g1_256x256.png" />
		<!--
			IBM Plex is self-hosted via @fontsource (see the imports at the top of
			app.css). It used to be pulled from the Google Fonts CDN here, but the
			server sets `style-src 'self' 'unsafe-inline'`, so that request was
			blocked by CSP and the declared UI font silently never loaded — every
			screen rendered in the fallback face. Self-hosting also removes an
			external runtime dependency for an offline-capable, self-hosted panel.
		-->
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
