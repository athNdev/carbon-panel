syntax = "proto3";

package carbonpanel.v1;

import "carbonpanel/v1/common.proto";

option go_package = "github.com/athNdev/carbon-panel/pkg/proto/carbonpanel/v1;carbonpanelv1";

// TCP proxy and routing management
service ProxyService {
  // List active proxy routes
  rpc GetProxyRoutes(GetProxyRoutesRequest) returns (GetProxyRoutesResponse);
  // Check proxy system status
  rpc GetProxyStatus(GetProxyStatusRequest) returns (GetProxyStatusResponse);
  // Modify proxy settings
  rpc UpdateProxyConfig(UpdateProxyConfigRequest) returns (UpdateProxyConfigResponse);
  // List all proxy listeners
  rpc GetProxyListeners(GetProxyListenersRequest) returns (GetProxyListenersResponse);
  // Add new listener port
  rpc CreateProxyListener(CreateProxyListenerRequest) returns (CreateProxyListenerResponse);
  // Modify listener settings
  rpc UpdateProxyListener(UpdateProxyListenerRequest) returns (UpdateProxyListenerResponse);
  // Remove listener port
  rpc DeleteProxyListener(DeleteProxyListenerRequest) returns (DeleteProxyListenerResponse);
  // Get server proxy configuration
  rpc GetServerRouting(GetServerRoutingRequest) returns (GetServerRoutingResponse);
  // Update server proxy hostname
  rpc UpdateServerRouting(UpdateServerRoutingRequest) returns (UpdateServerRoutingResponse);
  // Get current Velocity modern forwarding secret
  rpc GetVelocitySecret(GetVelocitySecretRequest) returns (GetVelocitySecretResponse);
  // Rotate or regenerate Velocity modern forwarding secret and sync to backend Paper/Folia servers
  rpc RotateVelocitySecret(RotateVelocitySecretRequest) returns (RotateVelocitySecretResponse);
  // Sync Velocity modern forwarding secret to a specific server's config files
  rpc SyncVelocitySecretToServer(SyncVelocitySecretToServerRequest) returns (SyncVelocitySecretToServerResponse);
}

// Active proxy connection
message ProxyRoute {
  string server_id = 1;
  string hostname = 2;
  string backend_host = 3;
  int32 backend_port = 4;
  bool active = 5;
}

// Empty routes request
message GetProxyRoutesRequest {}

// All proxy routes
message GetProxyRoutesResponse {
  repeated ProxyRoute routes = 1;
}

// Empty status request
message GetProxyStatusRequest {}

// Proxy system state
message GetProxyStatusResponse {
  bool enabled = 1;
  string base_url = 2;
  repeated int32 listen_ports = 3;
  repeated ProxyListener listeners = 4;
  int32 listen_port = 5; // Primary port
  bool running = 6;
  int32 active_routes = 7;
}

// Proxy settings to update
message UpdateProxyConfigRequest {
  bool enabled = 1;
  string base_url = 2;
}

// Updated proxy state
message UpdateProxyConfigResponse {
  bool enabled = 1;
  string base_url = 2;
  repeated int32 listen_ports = 3;
  repeated ProxyListener listeners = 4;
  int32 listen_port = 5;
  bool running = 6;
  int32 active_routes = 7;
}

// Empty listeners request
message GetProxyListenersRequest {}

// Listener with usage count
message ProxyListenerWithCount {
  ProxyListener listener = 1;
  int32 server_count = 2;
}

// All configured listeners
message GetProxyListenersResponse {
  repeated ProxyListenerWithCount listeners = 1;
}

// New listener configuration
message CreateProxyListenerRequest {
  string name = 1;
  string description = 2;
  int32 port = 3;
  bool enabled = 4;
  bool is_default = 5;
  bool proxy_protocol = 6;
}

// Created listener
message CreateProxyListenerResponse {
  ProxyListener listener = 1;
}

// Listener fields to update
message UpdateProxyListenerRequest {
  string id = 1;
  string name = 2;
  string description = 3;
  int32 port = 4;
  bool enabled = 5;
  bool is_default = 6;
  optional bool proxy_protocol = 7;
}

// Updated listener
message UpdateProxyListenerResponse {
  ProxyListener listener = 1;
}

// Listener to delete
message DeleteProxyListenerRequest {
  string id = 1;
}

// Deletion status
message DeleteProxyListenerResponse {
  string status = 1;
}

// Server routing lookup
message GetServerRoutingRequest {
  string server_id = 1;
}

// Active server route
message ServerRoute {
  string hostname = 1;
  bool active = 2;
}

// Server proxy configuration
message GetServerRoutingResponse {
  bool proxy_enabled = 1;
  string proxy_hostname = 2;
  string suggested_hostname = 3;
  string base_url = 4;
  int32 listen_port = 5;
  optional ServerRoute current_route = 6;
  string proxy_listener_id = 7;
}

// Hostname and listener to assign
message UpdateServerRoutingRequest {
  string server_id = 1;
  string proxy_hostname = 2;
  string proxy_listener_id = 3;
}

// Routing update result
message UpdateServerRoutingResponse {
  string status = 1;
  string hostname = 2;
  string proxy_listener_id = 3;
}

// Request to retrieve the current Velocity forwarding secret
message GetVelocitySecretRequest {}

// Response containing current Velocity forwarding secret
message GetVelocitySecretResponse {
  string secret = 1;
  bool auto_generated = 2;
  int32 synced_servers_count = 3;
}

// Request to rotate the Velocity forwarding secret
message RotateVelocitySecretRequest {
  optional string custom_secret = 1; // If empty, generates a cryptographically secure random 32-byte secret
  bool sync_all_servers = 2;         // If true, automatically updates paper.yml / config/paper-global.yml on all backend servers
}

// Response with newly rotated secret details
message RotateVelocitySecretResponse {
  string new_secret = 1;
  int32 synced_servers_count = 2;
  repeated string synced_server_ids = 3;
  string message = 4;
}

// Request to sync Velocity forwarding secret to a specific server
message SyncVelocitySecretToServerRequest {
  string server_id = 1;
}

// Response from syncing secret to a specific server
message SyncVelocitySecretToServerResponse {
  string server_id = 1;
  bool success = 2;
  string updated_file = 3;
  string message = 4;
}

